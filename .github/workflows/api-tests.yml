name: Testbook API tests

on:
  push:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the already-running Testbook API
        required: false
        default: http://localhost:8080
        type: string

jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || vars.API_BASE_URL || 'http://localhost:8080' }}

    steps:
      - name: Check out automation repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Remove old Book API container
        run: docker rm -f bookapi || true

      - name: Checkout Book API
        uses: actions/checkout@v4
        with:
          repository: kscorpio77/testbookapiworkflowdemo
          ref: main
          path: book-api

      - name: Build Book API Docker image
        run: docker build -t testbook-api:latest ./book-api

      - name: Start Book API container
        run: docker run -d --name bookapi -p 8080:8080 testbook-api:latest

      - name: Wait for Book API readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/api/books > /dev/null; then
              echo "Book API is ready!"
              exit 0
            fi

            echo "Waiting for Book API... ($i/30)"
            sleep 2
          done

          echo "Book API failed to start."
          docker logs bookapi
          exit 1

      - name: Run API tests
        run: mvn --batch-mode clean test -Dbase.url="${BASE_URL}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      - name: Generate Allure HTML report
        if: always()
        run: |
          curl -fsSL -o allure.zip https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.zip
          unzip -q allure.zip
          ./allure-2.29.0/bin/allure generate allure-results --clean -o allure-report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          if-no-files-found: warn




      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::074494041026:role/GitHubActionsTestbookS3Role
          aws-region: eu-north-1


      - name: Upload reports to S3
        if: always()
        run: |
          aws s3 sync allure-report/ s3://testbook-api-reports/allure-report/${{ github.run_id }}/
          aws s3 sync allure-results/ s3://testbook-api-reports/allure-results/${{ github.run_id }}/